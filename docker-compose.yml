version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: clouddisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: clouddisk123
      MYSQL_DATABASE: clouddisk
      MYSQL_USER: clouddisk
      MYSQL_PASSWORD: clouddisk123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  app:
    build: .
    container_name: clouddisk-app
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clouddisk?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: clouddisk
      SPRING_DATASOURCE_PASSWORD: clouddisk123
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
